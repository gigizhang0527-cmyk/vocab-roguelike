<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>词域探险 - Word Realm Roguelike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
#touch-layer{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none}
.touch-zone{position:absolute;pointer-events:auto}
#joystick-zone{left:0;bottom:0;width:40%;height:50%}
#btn-e{right:5%;bottom:28%;width:56px;height:56px;border-radius:50%;background:rgba(120,200,255,0.35);border:2px solid rgba(120,200,255,0.6);display:flex;align-items:center;justify-content:center;color:#fff;font:bold 13px sans-serif;pointer-events:auto}
#btn-q{right:5%;bottom:50%;width:56px;height:56px;border-radius:50%;background:rgba(142,195,255,0.3);border:2px solid rgba(142,195,255,0.5);display:flex;align-items:center;justify-content:center;color:#fff;font:bold 13px sans-serif;pointer-events:auto}
#btn-pause{position:absolute;right:4%;top:2%;width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;color:#fff;font:16px sans-serif;pointer-events:auto;z-index:11}
#btn-book{position:absolute;right:14%;top:2%;width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;color:#fff;font:13px sans-serif;pointer-events:auto;z-index:11}
#ui-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:12;pointer-events:none}
#btn-fs{position:absolute;right:4%;top:8%;width:40px;height:40px;border-radius:8px;background:rgba(100,200,255,0.2);border:1px solid rgba(100,200,255,0.4);display:flex;align-items:center;justify-content:center;color:#fff;font:11px sans-serif;pointer-events:auto}
#font-controls{position:absolute;left:3%;top:2%;display:flex;gap:4px;pointer-events:none}
#font-controls button{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;font:bold 18px sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#font-label{color:rgba(255,255,255,0.7);font:10px sans-serif;display:flex;align-items:center;padding:0 4px;pointer-events:none}
.joystick-base{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.25);pointer-events:none;display:none}
.joystick-knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.35);border:2px solid rgba(255,255,255,0.5);pointer-events:none;display:none;transform:translate(-50%,-50%)}
@media(min-width:768px){
  #btn-e,#btn-q{width:64px;height:64px;font:15px sans-serif}
  .joystick-base{width:140px;height:140px}
  .joystick-knob{width:60px;height:60px}
}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<!-- Mobile touch controls (joystick, buttons) -->
<div id="touch-layer">
  <div id="joystick-zone" class="touch-zone"></div>
  <div class="joystick-base" id="joy-base"></div>
  <div class="joystick-knob" id="joy-knob"></div>
  <div id="btn-e" class="touch-zone">拾取<br>E</div>
  <div id="btn-q" class="touch-zone">护盾<br>Q</div>
  <div id="btn-pause">⏸</div>
  <div id="btn-book">📖</div>
</div>
<!-- Always-visible UI overlay (fullscreen + font controls) -->
<div id="ui-overlay">
  <div id="btn-fs">⛶</div>
  <div id="font-controls">
    <button id="font-dec">A-</button>
    <div id="font-label">字体</div>
    <button id="font-inc">A+</button>
  </div>
</div>
<script src="js/game.js?v=3"></script>
</body>
</html>
